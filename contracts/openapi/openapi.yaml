            schema:
              $ref: '#/components/schemas/ImportStructureRequest'
            example:
              sourceText: |-
                [M b 22] Alex Sample
                [M b 13] Platform Engineer
                [S b 8.5] CONTACT
                [S li] alex.sample@example.com
                [M b 11] WORK EXPERIENCE
                [M b] Platform Engineer | 2024 - Present
                [M i] Example Systems · Springfield
                [M li] Built the <a href="https://example.com">example.com</a> platform.
              sourceFormat: pdf
              layoutHint:
                columns: 2
                sidebarSide: left
      responses:
        '200':
          description: The validated draft.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportStructureResult'
              examples:
                draft:
                  $ref: '#/components/examples/ImportStructureResultExample'
        '400':
          $ref: '#/components/responses/ValidationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ImportUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-rb_session
      description: Opaque server session cookie (`Secure`, `HttpOnly`, `SameSite=Strict`, `Path=/`), set by `login` (ADR-036).
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Echo of the readable `XSRF-TOKEN` cookie issued by `getSession`, `login` and `logout`. Required on every unsafe method, anonymous authentication requests included.

  parameters:
    ResumeId:
      name: resumeId
      in: path
      required: true
      description: Resume ID. A resume of another user is reported as 404.
      schema:
        type: string
        format: uuid
      example: 01934f6e-7a2b-7c3d-8e4f-5a6b7c8d9e0f
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      description: Snapshot ID.
      schema:
        type: string
        format: uuid
      example: 01935a10-2c3d-7e4f-9a0b-1c2d3e4f5a6b
    ResumeListState:
      name: state
      in: query
      required: false
      description: '`active` = library (default), `trashed` = trash.'
      schema:
        type: string
        enum: [active, trashed]
        default: active
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque `nextCursor` of the previous page. Valid only for the same query and user; an invalid cursor answers 400 `validation_failed` with `location` `query`.
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: '^[A-Za-z0-9_-]+$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Exactly one strong entity tag `"<version>"` from the last `ETag` the client received for
        this resume. Missing → 428 `precondition_required`; `*`, a list or a weak tag → 400
        `validation_failed` (`location: header`); stale → 412 `version_mismatch`.
      schema:
        type: string
        pattern: '^"[1-9][0-9]{0,17}"$'
      example: '"7"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUID, new for every distinct request body; keys are scoped to the user.
        Missing → 400 `idempotency_key_required`.

        Request hash: SHA-256 over the UTF-8 string `<METHOD> <request path without query>\n`
        followed by the body digest input, which is the RFC 8785 (JCS) canonical JSON of a JSON
        body; for `uploadPhoto` the raw bytes of the `file` part (never the multipart envelope);
        nothing for bodiless operations.

        - Same key and same hash → replay: the original status with the `ETag` and `Location` of
          the original result; the body is the current representation of the resource the
          original request created or changed (a replayed document write returns the stored
          result version and the warnings of the identical body).
        - Same key and a different hash → 422 `idempotency_key_reused`; nothing is written.
        - Same key while the first request is still in flight → 409
          `idempotency_request_in_progress` with `Retry-After`.

        Document writes remember the last key of the resume without expiry; other keyed
        operations keep keys for 24 hours. A coalesced autosave body is a new body and always gets
        a new key.
      schema:
        type: string
        format: uuid
      example: 9b2f6c1e-4d3a-4f8b-a1c2-3d4e5f6a7b8c
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: The `ETag` of a cached copy of the image; a match answers 304.
      schema:
        type: string
        maxLength: 200
      example: '"ph-3c1d9a7e"'

  headers:
    CacheControlNoStore:
      description: Personal data; never stored by any cache.
      required: true
      schema:
        type: string
        const: no-store
    CacheControlPrivateNoCache:
      description: Browser cache only, revalidated on every use.
      required: true
      schema:
        type: string
        const: private, no-cache
    NoSniff:
      description: Disables MIME sniffing.
      required: true
      schema:
        type: string
        const: nosniff
    ResumeETag:
      description: Strong entity tag of the resume version, `"<version>"`. Send it back in `If-Match`.
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]{0,17}"$'
      example: '"7"'
    PhotoETag:
      description: Strong entity tag of the image bytes (not the resume version).
      required: true
      schema:
        type: string
        pattern: '^"[A-Za-z0-9_-]{1,64}"$'
      example: '"ph-3c1d9a7e"'
    Location:
      description: URL of the created resource.
      required: true
      schema:
        type: string
        format: uri-reference
      example: /api/v1/resumes/01934f6e-7a2b-7c3d-8e4f-5a6b7c8d9e0f
    RetryAfter:
      description: Seconds to wait before retrying.
      required: true
      schema:
        type: integer
        minimum: 0
      example: 30
    RetryAfterOptional:
      description: Seconds to wait before retrying; present with `idempotency_request_in_progress`.
      required: false
      schema:
        type: integer
        minimum: 0
      example: 1

  responses:
    ValidationBadRequest:
      description: The request is malformed or fails validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validationFailed:
              $ref: '#/components/examples/ProblemValidationFailed'
            malformedRequest:
              $ref: '#/components/examples/ProblemMalformedRequest'
    PasswordPolicyBadRequest:
      description: The request fails validation, for example the password policy.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            passwordTooShort:
              $ref: '#/components/examples/ProblemPasswordTooShort'
            malformedRequest:
              $ref: '#/components/examples/ProblemMalformedRequest'
    TokenBadRequest:
      description: The token is invalid, expired or already used, or the request fails validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tokenInvalid:
              $ref: '#/components/examples/ProblemTokenInvalid'
            passwordTooShort:
              $ref: '#/components/examples/ProblemPasswordTooShort'
    KeyedBadRequest:
      description: The request is malformed, fails validation, has no `Idempotency-Key` or a malformed `If-Match`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validationFailed:
              $ref: '#/components/examples/ProblemValidationFailed'
            idempotencyKeyRequired:
              $ref: '#/components/examples/ProblemIdempotencyKeyRequired'
            ifMatchMalformed:
              $ref: '#/components/examples/ProblemIfMatchMalformed'
            duplicateId:
              $ref: '#/components/examples/ProblemDuplicateId'
            malformedRequest:
              $ref: '#/components/examples/ProblemMalformedRequest'
    PhotoBadRequest:
      description: The image cannot be decoded or exceeds the dimension limits, or the request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            photoInvalid:
              $ref: '#/components/examples/ProblemPhotoInvalid'
            idempotencyKeyRequired:
              $ref: '#/components/examples/ProblemIdempotencyKeyRequired'
    CropBadRequest:
      description: The crop is not square or lies outside the master, or the request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            cropNotSquare:
              $ref: '#/components/examples/ProblemCropNotSquare'
            idempotencyKeyRequired:
              $ref: '#/components/examples/ProblemIdempotencyKeyRequired'
    Unauthenticated:
      description: No valid session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthenticated:
              $ref: '#/components/examples/ProblemUnauthenticated'
    InvalidCredentials:
      description: Login failed. The same answer for every cause.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalidCredentials:
              $ref: '#/components/examples/ProblemInvalidCredentials'
    ReauthenticationRequired:
      description: No valid session, or no re-authentication within the last 5 minutes.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            reauthenticationRequired:
              $ref: '#/components/examples/ProblemReauthenticationRequired'
            unauthenticated:
              $ref: '#/components/examples/ProblemUnauthenticated'
    CsrfForbidden:
      description: The CSRF token is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            csrfTokenInvalid:
              $ref: '#/components/examples/ProblemCsrfTokenInvalid'
    ReauthenticationForbidden:
      description: The password is wrong (the session stays valid), or the CSRF token is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            reauthenticationFailed:
              $ref: '#/components/examples/ProblemReauthenticationFailed'
            csrfTokenInvalid:
              $ref: '#/components/examples/ProblemCsrfTokenInvalid'
    EmailNotVerified:
      description: The e-mail address is not verified.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            emailNotVerified:
              $ref: '#/components/examples/ProblemEmailNotVerified'
    NotFound:
      description: The resource does not exist or belongs to another user.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              $ref: '#/components/examples/ProblemNotFound'
    CreateResumeConflict:
      description: The resume limit is reached, the copy source is trashed, or the same `Idempotency-Key` is still in flight.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfterOptional'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            limitReached:
              $ref: '#/components/examples/ProblemLimitReached'
            resumeTrashed:
              $ref: '#/components/examples/ProblemResumeTrashed'
            inProgress:
              $ref: '#/components/examples/ProblemIdempotencyInProgress'
    ResumeTrashedConflict:
      description: The resume is in the trash (read-only), or the same `Idempotency-Key` is still in flight.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfterOptional'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            resumeTrashed:
              $ref: '#/components/examples/ProblemResumeTrashed'
            inProgress:
              $ref: '#/components/examples/ProblemIdempotencyInProgress'
    ResumeNotTrashedConflict:
      description: The resume is not in the trash, or the same `Idempotency-Key` is still in flight.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfterOptional'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            resumeNotTrashed:
              $ref: '#/components/examples/ProblemResumeNotTrashed'
            inProgress:
              $ref: '#/components/examples/ProblemIdempotencyInProgress'
    VersionMismatch:
      description: '`If-Match` is stale. The body carries the current version; no document content.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/VersionMismatchProblem'
          examples:
            versionMismatch:
              $ref: '#/components/examples/ProblemVersionMismatch'
    PayloadTooLarge:
      description: The body exceeds the size limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            payloadTooLarge:
              $ref: '#/components/examples/ProblemPayloadTooLarge'
    UnsupportedMediaType:
      description: The content type (or the detected image type) is not accepted.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unsupportedMediaType:
              $ref: '#/components/examples/ProblemUnsupportedMediaType'
    IdempotencyKeyReused:
      description: The `Idempotency-Key` was already used with a different request; nothing was written.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            idempotencyKeyReused:
              $ref: '#/components/examples/ProblemIdempotencyKeyReused'
    PreconditionRequired:
      description: '`If-Match` is missing.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            preconditionRequired:
              $ref: '#/components/examples/ProblemPreconditionRequired'
    RateLimited:
      description: A rate limit was exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rateLimited:
              $ref: '#/components/examples/ProblemRateLimited'
    ServiceUnavailable:
      description: The instance is not ready.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            serviceUnavailable:
              $ref: '#/components/examples/ProblemServiceUnavailable'
    ImportUnavailable:
      description: No structured draft could be produced; the client uses its fallback parser.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            importUnavailable:
              $ref: '#/components/examples/ProblemImportUnavailable'
    UnexpectedError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internalError:
              $ref: '#/components/examples/ProblemInternalError'
    PhotoNotModified:
      description: The cached image is current.
      headers:
        ETag:
          $ref: '#/components/headers/PhotoETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControlPrivateNoCache'

  schemas:
    # ---------------------------------------------------------------- shared scalars
    Uuid:
      type: string
      format: uuid
      description: UUID string.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC timestamp.
    NullableTimestamp:
      type: [string, 'null']
      format: date-time
      description: RFC 3339 UTC timestamp, or null.
    Email:
      type: string
      format: email
      maxLength: 254
      description: E-mail address.
    SafeUrl:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: '^(?:https?://|mailto:|tel:)[^\s\x00-\x1F\x7F-\x9F]+$'
      description: |
        Absolute URL with a lower-case scheme `https`, `http`, `mailto` or `tel`; no whitespace or
        control characters; at most 2048 code points (R-6). The only URL pattern in the contract.
      examples:
        - https://example.com/portfolio
    BinaryImage:
      type: string
      format: binary
      description: Raw image bytes.

    # ---------------------------------------------------------------- resume document (closed)
    ResumeDocument:
      type: object
      additionalProperties: false
      description: |
        The canonical resume document (TECHNICAL-SPEC §10.1), identical in requests and
        responses. Every property is required; "not set" is `null` for non-text values and `""`
        for free text. Server rules that JSON Schema cannot express:
        - R-4: every `id` (contacts, sections, list items, entries) is unique within the resume;
          otherwise 400 `validation_failed` with issue code `duplicate_id`.
        - R-12: the total user text (title, header, contacts, labels, section titles, entry
          fields, text runs, link URLs) is at most 50 000 code points; otherwise 400
          `validation_failed` with issue code `resume_text_limit_exceeded`.
        - R-7: an entry whose start is after its end is accepted and reported in
          `DocumentWriteResult.warnings` (code `date_range_inverted`), never as an error.
      required: [title, templateId, accentPreset, language, dateFormat, layout, header, sections]
      properties:
        title:
          type: string
          minLength: 0
          maxLength: 150
          description: Resume name shown in the library (FR-LIB-03).
        templateId:
          type: string
          enum: [T1, T2, T3, T4]
        accentPreset:
          type: integer
          minimum: 0
          maximum: 2
        language:
          type: string
          enum: [en, es, uk]
          description: Language of fixed labels and date formatting.
        dateFormat:
          type: string
          enum: [MonthYearLong, MonthYearShort, Numeric, YearOnly]
        layout:
          $ref: '#/components/schemas/LayoutSettings'
        header:
          $ref: '#/components/schemas/Header'
        sections:
          type: array
          maxItems: 100
          description: Ordered sections; the array order is the display order.
          items:
            $ref: '#/components/schemas/Section'
    LayoutSettings:
      type: object
      additionalProperties: false
      required: [fontPreset, sectionSpacing, entrySpacing, lineSpacing, pageSize, margins, bodyFont]
      properties:
        fontPreset:
          type: string
          enum: [S, M, L]
        sectionSpacing:
          type: integer
          minimum: 0
          maximum: 20
        entrySpacing:
          type: integer
          minimum: 0
          maximum: 20
        lineSpacing:
          type: integer
          minimum: 0
          maximum: 20
        pageSize:
          type: string
          enum: [A4, Letter]
        margins:
          $ref: '#/components/schemas/Margins'
        bodyFont:
          type: [string, 'null']
          pattern: '^[a-z0-9-]{1,40}$'
          description: Font ID from the template's font list; null = template default.
    Margins:
      type: object
      additionalProperties: false
      description: Page margins in points.
      required: [top, right, bottom, left]
      properties:
        top:
          type: number
          minimum: 10
          maximum: 50
          multipleOf: 0.5
        right:
          type: number
          minimum: 10
          maximum: 50
          multipleOf: 0.5
        bottom:
          type: number
          minimum: 10
          maximum: 50
          multipleOf: 0.5
        left:
          type: number
          minimum: 10
          maximum: 50
          multipleOf: 0.5
    Header:
      type: object
      additionalProperties: false
      description: The resume header; always rendered first and not a section. Photo metadata is on `Resume.photo`.
      required: [fullName, headline, showPhoto, contacts]
      properties:
        fullName:
          type: string
          minLength: 0
          maxLength: 120
          description: Required non-empty only to export (checked by the client), never to save.
        headline:
          type: string
          minLength: 0
          maxLength: 200
        showPhoto:
          type: boolean
        contacts:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ContactItem'
    ContactItem:
      type: object
      additionalProperties: false
      required: [id, text, url, kind]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        text:
          type: string
          minLength: 0
          maxLength: 200
        url:
          description: Explicit link target; null = derived at render time from the text (FR-HDR-04).
          oneOf:
            - $ref: '#/components/schemas/SafeUrl'
            - type: 'null'
        kind:
          type: string
          enum: [email, phone, location, link, other]

    Section:
      description: A resume section; `type` selects the variant and its `content` shape.
      oneOf:
        - $ref: '#/components/schemas/TextSection'
        - $ref: '#/components/schemas/InlineSection'
        - $ref: '#/components/schemas/ListSection'
        - $ref: '#/components/schemas/EntriesSection'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextSection'
          inline: '#/components/schemas/InlineSection'
          list: '#/components/schemas/ListSection'
          entries: '#/components/schemas/EntriesSection'
    SectionTitle:
      type: string
      minLength: 0
      maxLength: 80
      description: Section title as typed.
    ListColumns:
      type: [integer, 'null']
      enum: [1, 2, null]
      description: Column count override; null = template default by section type.
    Placement:
      type: [string, 'null']
      enum: [main, sidebar, null]
      description: Column placement for two-column templates (ADR-025); null = template default by type. Ignored by single-column templates.
    TextSection:
      type: object
      additionalProperties: false
      required: [id, type, title, hidden, listColumns, placement, content]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          const: text
        title:
          $ref: '#/components/schemas/SectionTitle'
        hidden:
          type: boolean
        listColumns:
          $ref: '#/components/schemas/ListColumns'
        placement:
          $ref: '#/components/schemas/Placement'
        content:
          $ref: '#/components/schemas/TextContent'
    InlineSection:
      type: object
      additionalProperties: false
      required: [id, type, title, hidden, listColumns, placement, content]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          const: inline
        title:
          $ref: '#/components/schemas/SectionTitle'
        hidden:
          type: boolean
        listColumns:
          $ref: '#/components/schemas/ListColumns'
        placement:
          $ref: '#/components/schemas/Placement'
        content:
          $ref: '#/components/schemas/InlineContent'
    ListSection:
      type: object
      additionalProperties: false
      required: [id, type, title, hidden, listColumns, placement, content]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          const: list
        title:
          $ref: '#/components/schemas/SectionTitle'
        hidden:
          type: boolean
        listColumns:
          $ref: '#/components/schemas/ListColumns'
        placement:
          $ref: '#/components/schemas/Placement'
        content:
          $ref: '#/components/schemas/ListContent'
    EntriesSection:
      type: object
      additionalProperties: false
      required: [id, type, title, hidden, listColumns, placement, content]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        type:
          type: string
          const: entries
        title:
          $ref: '#/components/schemas/SectionTitle'
        hidden:
          type: boolean
        listColumns:
          $ref: '#/components/schemas/ListColumns'
        placement:
          $ref: '#/components/schemas/Placement'
        content:
          $ref: '#/components/schemas/EntriesContent'
    TextContent:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          $ref: '#/components/schemas/RichText'
    InlineContent:
      type: object
      additionalProperties: false
      description: The body of an inline section is exactly one paragraph (R-3).
      required: [body]
      properties:
        body:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/Paragraph'
    ListContent:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ListItem'
    ListItem:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        text:
          $ref: '#/components/schemas/RichTextInline'
    EntriesContent:
      type: object
      additionalProperties: false
      required: [labels, entries]
      properties:
        labels:
          description: Custom field labels (ADR-023); null = template labels.
          oneOf:
            - $ref: '#/components/schemas/EntryLabels'
            - type: 'null'
        entries:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Entry'
    EntryLabels:
      type: object
      additionalProperties: false
      description: Per-section label overrides; null = the template label for that field.
      required: [title, organization, location]
      properties:
        title:
          type: [string, 'null']
          minLength: 1
          maxLength: 40
        organization:
          type: [string, 'null']
          minLength: 1
          maxLength: 40
        location:
          type: [string, 'null']
          minLength: 1
          maxLength: 40
    Entry:
      type: object
      additionalProperties: false
      required: [id, title, organization, location, start, end, dateText, description, pageBreakBefore]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
          minLength: 0
          maxLength: 150
        organization:
          type: string
          minLength: 0
          maxLength: 150
        location:
          type: string
          minLength: 0
          maxLength: 150
        start:
          description: Start date; null = not set.
          oneOf:
            - $ref: '#/components/schemas/PartialDate'
            - type: 'null'
        end:
          description: End date or "present"; null = not set.
          oneOf:
            - $ref: '#/components/schemas/EndDate'
            - type: 'null'
        dateText:
          type: string
          minLength: 0
          maxLength: 60
          description: When non-empty, printed instead of the computed dates.
        description:
          $ref: '#/components/schemas/RichText'
        pageBreakBefore:
          type: boolean
    PartialDate:
      type: object
      additionalProperties: false
      required: [kind, year, month]
      properties:
        kind:
          type: string
          const: date
        year:
          type: integer
          minimum: 1900
          maximum: 2100
        month:
          type: [integer, 'null']
          minimum: 1
          maximum: 12
          description: Month 1…12; null = year only.
    PresentDate:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          const: present
    EndDate:
      oneOf:
        - $ref: '#/components/schemas/PartialDate'
        - $ref: '#/components/schemas/PresentDate'
      discriminator:
        propertyName: kind
        mapping:
          date: '#/components/schemas/PartialDate'
          present: '#/components/schemas/PresentDate'

    RichText:
      type: array
      description: Rich text as blocks (TECHNICAL-SPEC §10.2). One list level; no headings, colours or sizes.
      items:
        $ref: '#/components/schemas/Block'
    Block:
      oneOf:
        - $ref: '#/components/schemas/Paragraph'
        - $ref: '#/components/schemas/BulletList'
      discriminator:
        propertyName: kind
        mapping:
          paragraph: '#/components/schemas/Paragraph'
          bulletList: '#/components/schemas/BulletList'
    Paragraph:
      type: object
      additionalProperties: false
      required: [kind, inlines]
      properties:
        kind:
          type: string
          const: paragraph
        inlines:
          $ref: '#/components/schemas/RichTextInline'
    BulletList:
      type: object
      additionalProperties: false
      required: [kind, items]
      properties:
        kind:
          type: string
          const: bulletList
        items:
          type: array
          minItems: 1
          description: One array of inlines per bullet.
          items:
            $ref: '#/components/schemas/RichTextInline'
    RichTextInline:
      type: array
      description: Inline content without blocks or lists.
      items:
        $ref: '#/components/schemas/Inline'
    Inline:
      oneOf:
        - $ref: '#/components/schemas/TextRun'
        - $ref: '#/components/schemas/Link'
        - $ref: '#/components/schemas/LineBreak'
      discriminator:
        propertyName: kind
        mapping:
          text: '#/components/schemas/TextRun'
          link: '#/components/schemas/Link'
          lineBreak: '#/components/schemas/LineBreak'
    TextRun:
      type: object
      additionalProperties: false
      required: [kind, value, bold, italic, underline]
      properties:
        kind:
          type: string
          const: text
        value:
          type: string
          minLength: 1
          maxLength: 50000
        bold:
          type: boolean
        italic:
          type: boolean
        underline:
          type: boolean
    Link:
      type: object
      additionalProperties: false
      description: A hyperlink around text runs. Links do not nest.
      required: [kind, url, children]
      properties:
        kind:
          type: string
          const: link
        url:
          $ref: '#/components/schemas/SafeUrl'
        children:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TextRun'
    LineBreak:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          const: lineBreak

    # ---------------------------------------------------------------- resources and results (responses; open)
    Resume:
      type: object
      required: [id, version, createdAt, updatedAt, deletedAt, purgeAt, photo, document]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 1
          description: Concurrency version; equals the value inside `ETag`.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        deletedAt:
          $ref: '#/components/schemas/NullableTimestamp'
        purgeAt:
          $ref: '#/components/schemas/NullableTimestamp'
        photo:
          description: Photo metadata; null = no photo.
          oneOf:
            - $ref: '#/components/schemas/PhotoInfo'
            - type: 'null'
        document:
          $ref: '#/components/schemas/ResumeDocument'
    ResumeSummary:
      type: object
      required: [id, version, title, templateId, createdAt, updatedAt, deletedAt, purgeAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 150
        templateId:
          type: string
          enum: [T1, T2, T3, T4]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        deletedAt:
          $ref: '#/components/schemas/NullableTimestamp'
        purgeAt:
          $ref: '#/components/schemas/NullableTimestamp'
    ResumePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ResumeSummary'
        nextCursor:
          type: [string, 'null']
          description: Cursor of the next page; null on the last page.
    ResumeState:
      type: object
      required: [id, version, updatedAt, deletedAt, purgeAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 1
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        deletedAt:
          $ref: '#/components/schemas/NullableTimestamp'
        purgeAt:
          $ref: '#/components/schemas/NullableTimestamp'
    DocumentWriteResult:
      type: object
      required: [id, version, updatedAt, warnings]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 1
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        warnings:
          type: array
          description: Non-blocking validation hints; never prevent a save.
          items:
            $ref: '#/components/schemas/ValidationWarning'
    ValidationWarning:
      type: object
      required: [pointer, code]
      properties:
        pointer:
          type: string
          maxLength: 512
          description: JSON Pointer into the request body.
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          description: Open warning code, for example `date_range_inverted`.
    PhotoInfo:
      type: object
      required: [id, mime, width, height, bytes, crop, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        mime:
          type: string
          enum: [image/jpeg, image/png, image/webp]
          description: Type of the master, detected from the bytes.
        width:
          type: integer
          minimum: 1
          maximum: 8000
          description: Master width in pixels.
        height:
          type: integer
          minimum: 1
          maximum: 8000
          description: Master height in pixels.
        bytes:
          type: integer
          minimum: 1
          description: Size of the master in bytes.
        crop:
          $ref: '#/components/schemas/PhotoCrop'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    PhotoCrop:
      type: object
      additionalProperties: false
      description: Crop rectangle in master-image pixels. Square in v1 (`width` = `height`).
      required: [x, y, width, height]
      properties:
        x:
          type: integer
          minimum: 0
          maximum: 7999
        y:
          type: integer
          minimum: 0
          maximum: 7999
        width:
          type: integer
          minimum: 1
          maximum: 8000
        height:
          type: integer
          minimum: 1
          maximum: 8000
    PhotoWriteResult:
      type: object
      required: [id, version, updatedAt, photo]
      properties:
        id:
          description: Resume ID.
          $ref: '#/components/schemas/Uuid'
        version:
          type: integer
          minimum: 1
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        photo:
          $ref: '#/components/schemas/PhotoInfo'
    SnapshotSummary:
      type: object
      required: [id, resumeId, resumeVersion, reason, createdAt, expiresAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        resumeId:
          $ref: '#/components/schemas/Uuid'
        resumeVersion:
          type: integer
          minimum: 1
          description: Resume version the snapshot captures.
        reason:
          type: string
          enum: [auto, before_export]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    Snapshot:
      allOf:
        - $ref: '#/components/schemas/SnapshotSummary'
        - type: object
          required: [document]
          properties:
            document:
              $ref: '#/components/schemas/ResumeDocument'
    SnapshotPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/SnapshotSummary'
        nextCursor:
          type: [string, 'null']
          description: Cursor of the next page; null on the last page.
    SessionInfo:
      type: object
      required: [authenticated, user]
      properties:
        authenticated:
          type: boolean
        user:
          description: The signed-in user; null when anonymous.
          oneOf:
            - $ref: '#/components/schemas/CurrentUser'
            - type: 'null'
    CurrentUser:
      type: object
      required: [id, email, emailVerified, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          $ref: '#/components/schemas/Email'
        emailVerified:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    AccountDataExport:
      type: object
      required: [exportedAt, account, resumes]
      properties:
        exportedAt:
          $ref: '#/components/schemas/Timestamp'
        account:
          $ref: '#/components/schemas/AccountData'
        resumes:
          type: array
          maxItems: 200
          description: Every resume of the account, active and trashed.
          items:
            $ref: '#/components/schemas/Resume'
    AccountData:
      type: object
      required: [id, email, createdAt, emailVerifiedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          $ref: '#/components/schemas/Email'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        emailVerifiedAt:
          $ref: '#/components/schemas/NullableTimestamp'
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    # ---------------------------------------------------------------- requests (closed)
    CreateResumeRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateFromDocument'
        - $ref: '#/components/schemas/CreateCopy'
      discriminator:
        propertyName: source
        mapping:
          document: '#/components/schemas/CreateFromDocument'
          copy: '#/components/schemas/CreateCopy'
    CreateFromDocument:
      type: object
      additionalProperties: false
      description: Store a document built by the client (blank resume, guest claim, conflict copy).
      required: [source, document, copyPhotoFromResumeId]
      properties:
        source:
          type: string
          const: document
        document:
          $ref: '#/components/schemas/ResumeDocument'
        copyPhotoFromResumeId:
          description: Copy the photo of this resume of the caller; null = no photo. 404 if it does not exist.
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    CreateCopy:
      type: object
      additionalProperties: false
      description: Copy an active resume of the caller on the server, photo included.
      required: [source, sourceResumeId, title]
      properties:
        source:
          type: string
          const: copy
        sourceResumeId:
          $ref: '#/components/schemas/Uuid'
        title:
          type: [string, 'null']
          minLength: 0
          maxLength: 150
          description: Title of the copy; null = keep the source title.
    CreateSnapshotRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          const: before_export
    PhotoUploadRequest:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: JPEG, PNG or WebP image, at most 5 MB. The declared part type is ignored.
    SignUpRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          writeOnly: true
          minLength: 10
          maxLength: 128
          description: 10…128 characters; violations are reported as `password_too_short` / `password_too_long`; common passwords as `password_too_common`.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          $ref: '#/components/schemas/EmailToken'
    EmailToken:
      type: string
      writeOnly: true
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: Single-use token from the e-mail link (32 random bytes, base64url).
    ResendVerificationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, newPassword]
      properties:
        token:
          $ref: '#/components/schemas/EmailToken'
        newPassword:
          $ref: '#/components/schemas/NewPassword'
    NewPassword:
      type: string
      writeOnly: true
      minLength: 10
      maxLength: 128
      description: 10…128 characters; violations are reported as `password_too_short` / `password_too_long`; common passwords as `password_too_common`.
    ReauthenticateRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [newPassword]
      properties:
        newPassword:
          $ref: '#/components/schemas/NewPassword'
    ClientEventBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/ClientEvent'
    ClientEvent:
      type: object
      additionalProperties: false
      description: Content-free by construction; no free-text property.
      required: [type, code, resumeId, engineVersion, occurredAt]
      properties:
        type:
          type: string
          enum: [export_mismatch, export_failed, preview_failed, autosave_failed, idempotency_key_reused, unexpected_error]
        code:
          type: string
          pattern: '^[a-z0-9_.-]{1,64}$'
          description: Machine code of the failure, for example `page_count.differs`.
        resumeId:
          type: [string, 'null']
          format: uuid
          description: Affected resume; null when not resume-specific.
        engineVersion:
          type: [string, 'null']
          pattern: '^[0-9A-Za-z.+-]{1,32}$'
          description: Layout engine version; null when not applicable.
        occurredAt:
          type: string
          format: date-time

    # ---------------------------------------------------------------- problems (RFC 9457)
    ImportStructureRequest:
      type: object
      additionalProperties: false
      description: The text the browser extracted from a CV (ADR-055). Never the file.
      required: [sourceText, sourceFormat, layoutHint]
      properties:
        sourceText:
          type: string
          minLength: 1
          maxLength: 60000
          description: One line per text line, each prefixed by short attribute tags (column, weight, style, size, list item); inline `<b>`, `<i>` and `<a href>` only.
        sourceFormat:
          type: string
          enum: [pdf, txt, docx]
        layoutHint:
          $ref: '#/components/schemas/ImportLayoutHint'
    ImportLayoutHint:
      type: object
      additionalProperties: false
      required: [columns, sidebarSide]
      properties:
        columns:
          type: integer
          enum: [1, 2]
        sidebarSide:
          type: [string, 'null']
          enum: [left, right, null]
    ImportStructureResult:
      type: object
      additionalProperties: false
      required: [draft, escalated, warnings]
      properties:
        draft:
          $ref: '#/components/schemas/ImportDraft'
        escalated:
          type: boolean
          description: True when the draft came from the escalation model.
        warnings:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ImportWarning'
    ImportWarning:
      type: object
      additionalProperties: false
      description: A change the server made to the model's draft. Never the value itself.
      required: [code, pointer]
      properties:
        code:
          type: string
          enum: [not_in_source, clamped, over_limit]
          description: '`not_in_source`: removed by the verbatim check; `clamped`: cut to its length limit; `over_limit`: an array item beyond the limit was dropped.'
        pointer:
          type: string
          maxLength: 200
          description: JSON Pointer into the draft as the model returned it.
    ImportDraft:
      type: object
      additionalProperties: false
      description: |
        A compact structure of the user's own strings; the browser builds a `ResumeDocument` from it.
        Strings may hold inline `<b>`, `<i>` and `<a href="…">` and nothing else.
      required: [fullName, headline, contacts, language, sections]
      properties:
        fullName:
          type: string
          maxLength: 120
        headline:
          type: [string, 'null']
          maxLength: 200
        contacts:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ImportDraftContact'
        language:
          type: [string, 'null']
          enum: [en, es, uk, null]
        sections:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ImportDraftSection'
    ImportDraftContact:
      type: object
      additionalProperties: false
      required: [text, kind]
      properties:
        text:
          type: string
          maxLength: 200
        kind:
          type: string
          enum: [email, phone, location, link, other]
    ImportDraftSection:
      type: object
      additionalProperties: false
      required: [title, type, placement, blocks, items, entries]
      properties:
        title:
          type: string
          maxLength: 80
        type:
          type: string
          enum: [text, list, entries]
        placement:
          type: string
          enum: [main, sidebar]
        blocks:
          type: array
          maxItems: 200
          description: The body of a `text` section; empty otherwise.
          items:
            $ref: '#/components/schemas/ImportDraftBlock'
        items:
          type: array
          maxItems: 100
          description: The items of a `list` section; empty otherwise.
          items:
            type: string
            maxLength: 2000
        entries:
          type: array
          maxItems: 100
          description: The entries of an `entries` section; empty otherwise.
          items:
            $ref: '#/components/schemas/ImportDraftEntry'
    ImportDraftEntry:
      type: object
      additionalProperties: false
      required: [title, organization, location, start, end, present, dateText, blocks]
      properties:
        title:
          type: [string, 'null']
          maxLength: 150
        organization:
          type: [string, 'null']
          maxLength: 150
        location:
          type: [string, 'null']
          maxLength: 150
        start:
          oneOf:
            - $ref: '#/components/schemas/ImportDraftDate'
            - type: 'null'
        end:
          oneOf:
            - $ref: '#/components/schemas/ImportDraftDate'
            - type: 'null'
        present:
          type: boolean
          description: The entry runs to the present; `end` is null.
        dateText:
          type: [string, 'null']
          maxLength: 60
          description: The source's dates as written, when they do not parse into `start`/`end`.
        blocks:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ImportDraftBlock'
    ImportDraftDate:
      type: object
      additionalProperties: false
      required: [year, month]
      properties:
        year:
          type: integer
          minimum: 1900
          maximum: 2100
        month:
          type: [integer, 'null']
          minimum: 1
          maximum: 12
    ImportDraftBlock:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [paragraph, bullet]
        text:
          type: string
          maxLength: 10000
    Problem:
      type: object
      description: RFC 9457 Problem Details. Never contains submitted values or document content.
      required: [title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem type URI; `about:blank` when not set.
        title:
          type: string
          maxLength: 200
          description: Generic, human-readable summary; never user data.
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          description: Machine-readable problem code (open catalogue in `info.description`).
        detail:
          type: string
          maxLength: 500
          description: Generic explanation; never user data.
        traceId:
          type: string
          minLength: 1
          maxLength: 128
          description: Correlation ID for support and logs.
        errors:
          type: array
          maxItems: 100
          description: Validation issues (400 `validation_failed`).
          items:
            $ref: '#/components/schemas/ValidationIssue'
    ValidationIssue:
      type: object
      description: Where and why validation failed. Never the submitted value.
      required: [location, pointer, code]
      properties:
        location:
          type: string
          enum: [body, query, header, path]
        pointer:
          type: string
          maxLength: 512
          description: JSON Pointer into the body for `body`; the parameter or header name otherwise.
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          description: Open issue code (catalogue in `info.description`).
    VersionMismatchProblem:
      description: 412 `version_mismatch`; carries the current version only, no document content.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [currentVersion, updatedAt]
          properties:
            currentVersion:
              type: integer
              minimum: 1
            updatedAt:
              $ref: '#/components/schemas/Timestamp'

  examples:
    # ---------------------------------------------------------------- session
    SessionAuthenticated:
      summary: Signed-in user
      value:
        authenticated: true
        user:
          id: 01934e2a-1b2c-7d3e-8f40-5a6b7c8d9e01
          email: alex.sample@example.com
          emailVerified: true
          createdAt: '2026-10-01T08:00:00Z'
    SessionAnonymous:
      summary: Anonymous visitor
      value:
        authenticated: false
        user: null

    # ---------------------------------------------------------------- resumes
    ResumeDocumentFull:
      summary: Document with all four section types
      value:
        title: Backend engineer (sample)
        templateId: T1
        accentPreset: 0
        language: en
        dateFormat: MonthYearLong
        layout:
          fontPreset: M
          sectionSpacing: 10
          entrySpacing: 10
          lineSpacing: 1
          pageSize: A4
          margins: {top: 23, right: 23, bottom: 23, left: 23}
          bodyFont: null
        header:
          fullName: Alex Sample
          headline: Backend engineer · .NET · Cloud
          showPhoto: true
          contacts:
            - {id: 6f1c2b3a-4d5e-4f60-8a7b-9c0d1e2f3a01, text: alex.sample@example.com, url: null, kind: email}
