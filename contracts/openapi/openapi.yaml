      summary: Structure the extracted text of an imported CV
      description: |
        The browser extracts the text of a CV (ADR-055) and sends only that text. The server asks the
        configured model to assign the user's own strings to an `ImportDraft` and returns it after
        validation. Every draft string occurs in `sourceText` (the verbatim check, X1): a string that
