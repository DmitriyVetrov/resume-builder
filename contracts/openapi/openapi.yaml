openapi: 3.1.0
info:
  title: Resume Builder API
  version: 1.2.0
  license:
    name: Proprietary (all rights reserved; no license granted)
    identifier: LicenseRef-Proprietary
  summary: Canonical HTTP contract between the resume builder backend and frontend.
  description: |
    Canonical HTTP contract v1 (ADR-006). Backend and frontend share no code; this document is
    the only link between them. Design input: `docs/phases/P02/architecture/phase-plan.md` §5–§8.

    ## Conventions
    - Base path `/api/v1` on the same origin. Property names are camelCase; enum literals follow
      TECHNICAL-SPEC §10.1. IDs are UUID strings (server IDs UUID v7, nested document IDs are
      generated by the client). Timestamps are RFC 3339 UTC `date-time`.
    - String lengths are JSON Schema `minLength`/`maxLength` and count Unicode code points.
    - In `ResumeDocument` every property is required. "Not set" is `null` for non-text values and
      `""` for free text. No field is mandatory for saving.
    - Unions are discriminated objects (`kind`, `type`, `source`) with `const` values and an
      explicit `discriminator.mapping`.
    - Request schemas are closed (`additionalProperties: false` on every object). Response-only
      schemas are open: clients must ignore unknown response properties.
    - Server-owned values (resource IDs, `version`, timestamps, photo metadata) appear only in
      responses, never in request bodies.
    - There are no server endpoints for PDF, TXT or any other resume export, import, sharing,
      AI features or payments (TECHNICAL-SPEC §3.2, ADR-010). Preview, PDF and TXT are produced in
      the browser from `getResume` and `getPhotoRendition`.

    ## Authentication and CSRF (ADR-036)
    - The session is the `__Host-rb_session` cookie (`sessionCookie`). `getSession` (anonymous
      allowed) issues the readable `XSRF-TOKEN` cookie; `login` and `logout` re-issue it.
    - Every unsafe method (POST, PUT, DELETE), anonymous authentication requests included, must
      echo that token in the `X-XSRF-TOKEN` header (`csrfHeader`). Missing or invalid → 403
      `csrf_token_invalid`.
    - Missing or expired session on a protected operation → 401 `unauthenticated`.
    - A resume, snapshot or photo of another user is reported as 404 `not_found`, never 403.
    - Operations marked `x-requires-reauth: true` need a successful `reauthenticate` on the current
      session within the last 5 minutes, otherwise 401 `reauthentication_required`. Operations
      marked `x-requires-verified-email: true` need a verified address, otherwise 403
      `email_not_verified`.

    ## Errors (RFC 9457)
    Every 4xx and 5xx response is `application/problem+json` (`Problem`; 412 uses
    `VersionMismatchProblem`). Clients branch on `code`; an unknown `code` is handled by its HTTP
    status class. Problems never echo submitted values or document content: validation issues
    carry `location`, `pointer` and `code` only.

    Problem codes (open catalogue; new codes are additive):

    | code | status |
    |---|---|
    | `validation_failed` | 400 |
    | `malformed_request` | 400 (unparseable JSON, nesting depth > 64) |
    | `idempotency_key_required` | 400 |
    | `token_invalid` | 400 (invalid, expired or already used token) |
    | `photo_invalid` | 400 (undecodable image, > 8000 px per side or > 40 MP) |
    | `unauthenticated` | 401 |
    | `invalid_credentials` | 401 |
    | `reauthentication_required` | 401 |
    | `csrf_token_invalid` | 403 |
    | `reauthentication_failed` | 403 |
    | `email_not_verified` | 403 |
    | `not_found` | 404 |
    | `resume_trashed` | 409 |
    | `resume_not_trashed` | 409 |
    | `limit_reached` | 409 |
    | `idempotency_request_in_progress` | 409 |
    | `version_mismatch` | 412 |
    | `payload_too_large` | 413 |
    | `unsupported_media_type` | 415 |
    | `idempotency_key_reused` | 422 |
    | `precondition_required` | 428 |
    | `rate_limited` | 429 |
    | `internal_error` | 500 |
    | `service_unavailable` | 503 |
    | `import_unavailable` | 503 (`structureResumeImport`: no structured draft; the client uses its fallback parser) |

    `ValidationIssue.code` catalogue (open): schema rules `required`, `type`, `const`, `enum`,
    `format`, `pattern`, `min_length`, `max_length`, `minimum`, `maximum`, `multiple_of`,
    `min_items`, `max_items`, `unknown_property`; domain rules `duplicate_id`,
    `resume_text_limit_exceeded`, `crop_not_square`, `crop_out_of_bounds`, `password_too_short`,
    `password_too_long`, `password_too_common`. Password length bounds are reported with the
    password codes, not with `min_length`/`max_length`.

    ## Concurrency (ADR-037)
    The resume version is a strong entity tag `"<version>"` returned in `ETag` by `getResume`,
    `createResume` and every resume-level write. Every resume-level write requires `If-Match` with
    exactly that form: missing → 428 `precondition_required`; `*`, a list or a weak tag → 400
    `validation_failed` (`location: header`); stale → 412 `version_mismatch` with `currentVersion`
    and `updatedAt`. Every successful write (document, trash, restore, photo) increments `version`
    by exactly 1. A 2xx is sent only after the write is durable; clients show "Saved" only then.

    Evaluation order for a keyed, versioned write: authentication (401) → CSRF (403) → request
    syntax and size (400/413/415) → `Idempotency-Key` present (400) → idempotency replay or 422 →
    resume exists and is owned (404) → trash state (409) → `If-Match` (428/412) → domain
    validation (400) → write.

    ## Idempotency (ADR-037)
    See the `Idempotency-Key` parameter for the request-hash rule, replay, 422 and 409 semantics.

    ## Pagination
    Cursor based: `limit` 1…200 (default 50) and an opaque `cursor`; responses are
    `{items, nextCursor}` with `nextCursor: null` on the last page. Order is fixed per endpoint;
    there is no `sort` parameter in v1.

    ## Limits (NFR-12, ADR-038)
    JSON body ≤ 1 MB; `uploadPhoto` body ≤ 6 MB with a `file` part ≤ 5 MB; `reportClientEvents`
    body ≤ 16 KB; `structureResumeImport` body ≤ 256 KB → 413 `payload_too_large`. Unsafe requests accept only `application/json`
    (`multipart/form-data` for `uploadPhoto`) → otherwise 415 `unsupported_media_type`. Each
    operation names its ADR-038 rate-limit policy in `x-rate-limit-policy`; limits answer 429
    `rate_limited` with `Retry-After` (seconds).

    ## Extensions
    - `x-phase`: the phase that implements the operation in the backend.
    - `x-rate-limit-policy`: the ADR-038 policy (`global` when only the global limit applies).
    - `x-requires-reauth`, `x-requires-verified-email`: see Authentication.

    ## Versioning
    `info.version` is semver: minor for additive changes, patch for descriptions and examples.
    Breaking changes follow ADR-006 §5 and phase-plan §9.3. Post-1.0 properties added to
    `ResumeDocument` are optional in requests and mean "keep the stored value" when absent.
servers:
  - url: /api/v1
    description: Same-origin API base path.
tags:
  - name: Health
    description: Liveness and readiness probes. Anonymous; bodies never name dependencies.
  - name: Session
    description: Session discovery, CSRF bootstrap and first-party authentication (ADR-036).
  - name: Account
    description: Password change, account deletion and the account data archive (FR-ACC-03, FR-ACC-04).
  - name: Resumes
    description: Resume library, documents and trash (FR-LIB, FR-PER-01…03, ADR-016, ADR-037).
  - name: Snapshots
    description: Version snapshots of a resume (FR-PER-05). Restore is a normal document replace.
  - name: Photos
    description: One profile photo per resume (FR-PHO-01…05, ADR-009).
  - name: Telemetry
    description: Content-free client error events (NFR-13, ADR-010 §8).
  - name: Imports
    description: Structuring the text of an imported CV (ADR-055). The file and the photo stay in the browser.

paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Liveness probe
      description: Returns 200 while the process is running.
      x-phase: P04
      x-rate-limit-policy: global
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness probe
      description: Returns 200 when the instance can serve requests, otherwise 503. The body never names dependencies, versions or timings.
      x-phase: P04
      x-rate-limit-policy: global
      security: []
      responses:
        '200':
          description: The instance is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: ok
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /session:
    get:
      tags: [Session]
      operationId: getSession
      summary: Current session
      description: |
        Returns whether the caller is signed in and, if so, the current user. Anonymous callers
        get `authenticated: false` (never 401). Always (re)issues the readable `XSRF-TOKEN` cookie
        that the client echoes in `X-XSRF-TOKEN` on every unsafe request.
      x-phase: P06
      x-rate-limit-policy: global
      security:
        - {}
        - sessionCookie: []
      responses:
        '200':
          description: Session state. Sets the `XSRF-TOKEN` cookie.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
              examples:
                authenticated:
                  $ref: '#/components/examples/SessionAuthenticated'
                anonymous:
                  $ref: '#/components/examples/SessionAnonymous'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/sign-up:
    post:
      tags: [Session]
      operationId: signUp
      summary: Sign up with e-mail and password
      description: |
        Registers an account and sends a verification e-mail. Always answers 202 with no body for
        any syntactically valid address, whether or not it is already registered
        (anti-enumeration). Never opens a session.
      x-phase: P06
      x-rate-limit-policy: auth-email
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            example:
              email: new.user@example.com
              password: correct-horse-battery-staple
      responses:
        '202':
          description: Accepted. A verification e-mail is sent if applicable.
        '400':
          $ref: '#/components/responses/PasswordPolicyBadRequest'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/verify-email:
    post:
      tags: [Session]
      operationId: verifyEmail
      summary: Verify an e-mail address
      description: Marks the address verified. Invalid, expired and used tokens all answer 400 `token_invalid`. Never opens a session.
      x-phase: P06
      x-rate-limit-policy: global
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
            example:
              token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      responses:
        '204':
          description: The address is verified.
        '400':
          $ref: '#/components/responses/TokenBadRequest'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/resend-verification:
    post:
      tags: [Session]
      operationId: resendVerification
      summary: Resend the verification e-mail
      description: Always answers 202 with no body for any syntactically valid address (anti-enumeration).
      x-phase: P06
      x-rate-limit-policy: auth-email
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
            example:
              email: new.user@example.com
      responses:
        '202':
          description: Accepted.
        '400':
          $ref: '#/components/responses/ValidationBadRequest'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/login:
    post:
      tags: [Session]
      operationId: login
      summary: Log in
      description: |
        Opens a session: sets the `__Host-rb_session` cookie and re-issues `XSRF-TOKEN`. Any
        failure (unknown address, wrong password, back-off) answers 401 `invalid_credentials`
        or 429.
      x-phase: P06
      x-rate-limit-policy: auth-login
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: alex.sample@example.com
              password: correct-horse-battery-staple
      responses:
        '200':
          description: Logged in. Sets the session cookie and a new `XSRF-TOKEN` cookie.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
              examples:
                authenticated:
                  $ref: '#/components/examples/SessionAuthenticated'
        '400':
          $ref: '#/components/responses/ValidationBadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/logout:
    post:
      tags: [Session]
      operationId: logout
      summary: Log out
      description: Revokes the current session, clears the session cookie and re-issues `XSRF-TOKEN`.
      x-phase: P06
      x-rate-limit-policy: global
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Logged out.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/password-reset/request:
    post:
      tags: [Session]
      operationId: requestPasswordReset
      summary: Request a password reset e-mail
      description: Always answers 202 with no body for any syntactically valid address (anti-enumeration).
      x-phase: P06
      x-rate-limit-policy: auth-email
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              email: alex.sample@example.com
      responses:
        '202':
          description: Accepted.
        '400':
          $ref: '#/components/responses/ValidationBadRequest'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/password-reset/confirm:
    post:
      tags: [Session]
      operationId: confirmPasswordReset
      summary: Set a new password with a reset token
      description: |
        Sets the new password, marks the address verified and revokes every session of the
        account. Invalid, expired and used tokens all answer 400 `token_invalid`; password policy
        failures answer 400 `validation_failed` with a password code.
      x-phase: P06
      x-rate-limit-policy: global
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
            example:
              token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
              newPassword: another-correct-horse-staple
      responses:
        '204':
          description: Password changed; all sessions revoked.
        '400':
          $ref: '#/components/responses/TokenBadRequest'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /auth/reauthenticate:
    post:
      tags: [Session]
      operationId: reauthenticate
      summary: Confirm the password for sensitive operations
      description: |
        Checks the password and stamps the current session with a re-authentication time.
        `changePassword`, `requestAccountDeletion` and `exportAccountData` accept a stamp at most
        5 minutes old. A wrong password answers 403 `reauthentication_failed`; the session stays
        valid. Login back-off applies.
      x-phase: P06
      x-rate-limit-policy: auth-login
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthenticateRequest'
            example:
              password: correct-horse-battery-staple
      responses:
        '204':
          description: The session is stamped as re-authenticated.
        '400':
          $ref: '#/components/responses/ValidationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ReauthenticationForbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /account/password:
    put:
      tags: [Account]
      operationId: changePassword
      summary: Change the password
      description: |
        Requires a re-authentication stamp at most 5 minutes old. On success every session of
        the account is revoked, the current one included, and the session cookie is cleared.
      x-phase: P06
      x-rate-limit-policy: global
      x-requires-reauth: true
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              newPassword: another-correct-horse-staple
      responses:
        '204':
          description: Password changed; all sessions revoked; session cookie cleared.
        '400':
          $ref: '#/components/responses/PasswordPolicyBadRequest'
        '401':
          $ref: '#/components/responses/ReauthenticationRequired'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /account:
    delete:
      tags: [Account]
      operationId: requestAccountDeletion
      summary: Delete the account
      description: |
        Requires a re-authentication stamp at most 5 minutes old. Revokes every session, clears
        the session cookie and schedules the purge of all account data within 24 hours
        (FR-ACC-03, ADR-039 §2).
      x-phase: P06
      x-rate-limit-policy: global
      x-requires-reauth: true
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '202':
          description: Deletion accepted; sessions revoked; session cookie cleared.
        '401':
          $ref: '#/components/responses/ReauthenticationRequired'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /account/data-export:
    get:
      tags: [Account]
      operationId: exportAccountData
      summary: Download the account data archive
      description: |
        Streams one JSON document with the account and every resume, active and trashed
        (FR-ACC-04, ADR-039 §6). Photos are fetched separately with `getPhotoMaster`; PDF and TXT
        files are added by the browser. Requires a re-authentication stamp at most 5 minutes old
        and a verified address.
      x-phase: P06
      x-rate-limit-policy: data-export
      x-requires-reauth: true
      x-requires-verified-email: true
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The account data archive.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDataExport'
              examples:
                archive:
                  $ref: '#/components/examples/AccountDataExportExample'
        '401':
          $ref: '#/components/responses/ReauthenticationRequired'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'

  /resumes:
    get:
      tags: [Resumes]
      operationId: listResumes
      summary: List resumes (library or trash)
      description: |
        Summary projection of the caller's resumes. `state=active` (default) is the library,
        ordered by `updatedAt` descending then `id`; `state=trashed` is the trash, ordered by
        `deletedAt` descending then `id`.
      x-phase: P07
      x-rate-limit-policy: global
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ResumeListState'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of resume summaries.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumePage'
              examples:
                library:
                  $ref: '#/components/examples/ResumePageExample'
        '400':
          $ref: '#/components/responses/ValidationBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/UnexpectedError'
    post:
      tags: [Resumes]
      operationId: createResume
      summary: Create a resume
      description: |
        `source: document` stores a document built by the client (a blank resume, a claimed guest
        resume or a conflict copy); `copyPhotoFromResumeId` optionally copies the photo of one of
        the caller's resumes. `source: copy` copies one of the caller's active resumes on the
        server, photo included, optionally with a new title. A user has at most 200 resumes,
        active plus trashed (409 `limit_reached`). Copying a trashed resume answers 409
        `resume_trashed`.
      x-phase: P07
      x-rate-limit-policy: doc-write
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResumeRequest'
            examples:
              fromDocument:
                $ref: '#/components/examples/CreateFromDocumentExample'
              copy:
                $ref: '#/components/examples/CreateCopyExample'
      responses:
        '201':
          description: Created. A replay of the same request returns 201 again with the same `Location`.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ResumeETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
              examples:
                created:
                  $ref: '#/components/examples/ResumeCreatedExample'
        '400':
          $ref: '#/components/responses/KeyedBadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '404':
