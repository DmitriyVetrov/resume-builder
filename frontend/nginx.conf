# DD-P13-18: hashed assets are immutable; everything else, index.html included, is revalidated.
map $uri $cache_control {
  ~^/assets/ "public, max-age=31536000, immutable";
  default "no-cache";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/javascript application/javascript text/css font/ttf application/json image/svg+xml;
  # NFR-08, NFR-09 (DD-P13-18, DD-P13-19). Set here only: a location with an add_header of its own would drop these.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cache-Control $cache_control always;
  location ~* \.ttf$ { default_type font/ttf; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
